services:
  - type: web
    name: finance-tracker-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: EMAIL
        sync: false
      - key: EMAIL_PASS
        sync: false
